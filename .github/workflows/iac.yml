name: Day 3 infrastructure verification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The runner uses the supported major setup action; Terraform itself is
      # constrained by infra/versions.tf and validation uses that constraint.
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12'

      - name: Install pinned verification tools
        run: python -m pip install --disable-pip-version-check checkov==3.3.19 pytest==8.4.2 pyyaml==6.0.2

      - name: Run Day 3 milestone tests
        run: python -m pytest -q tests/milestones/day3

      - name: Terraform format
        run: terraform fmt -check -recursive infra

      - name: Terraform init
        working-directory: infra
        run: terraform init -backend=false -input=false -lockfile=readonly

      - name: Terraform validate
        working-directory: infra
        run: terraform validate -no-color

      - name: Checkov
        run: checkov -d infra --quiet

      - name: Build deployment artifact and provenance
        run: |
          mkdir -p ci-output
          python scripts/build_day3_artifact.py \
            --output ci-output/day3-deployment.zip \
            --manifest ci-output/source-manifest.json

      - name: Upload verification-source
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: verification-source
          path: ci-output/
          if-no-files-found: error
          retention-days: 7
