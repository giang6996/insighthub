apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: insighthub
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      serviceAccountName: api
      containers:
        - name: api
          image: REPLACE_WITH_IMMUTABLE_API_ECR_IMAGE
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: insighthub-runtime
            - secretRef:
                name: insighthub-rds-fields
          volumeMounts:
            - name: staging
              mountPath: /data/staging
            - name: rds-secrets
              mountPath: /mnt/secrets-store
              readOnly: true
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: staging
          persistentVolumeClaim:
            claimName: insighthub-staging
        - name: rds-secrets
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: insighthub-rds
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: insighthub
spec:
  type: ClusterIP
  selector:
    app: api
  ports:
    - name: http
      port: 8000
      targetPort: http
