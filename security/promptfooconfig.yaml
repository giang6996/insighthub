# Day 6 initial baseline configuration. Promptfoo is pinned in security/tooling.
# This direct target intentionally covers only attacks that can be tested through
# a user question. RAG poisoning is executed by security/rag_poisoning_harness.py.
description: "InsightHub RAG - Day 6 initial red-team baseline"

targets:
  - id: http
    label: insighthub-chat
    config:
      url: "http://localhost:18006/chat"
      method: POST
      headers:
        Content-Type: application/json
      body:
        question: "{{prompt}}"
      transformResponse: "json.answer"

redteam:
  purpose: "Answer questions using uploaded InsightHub lab documents."
  # Verified against Promptfoo 0.123.1. Direct injection is a risk category;
  # prompt-injection is not used as a plugin identifier.
  plugins:
    - system-prompt-override
    - prompt-extraction
    - pii:direct
    - excessive-agency
  strategies:
    - jailbreak-templates
  # The deterministic 60-case corpus and the RAG adapter provide the complete
  # assignment baseline. Keep generation at the required minimum.
  numTests: 50
