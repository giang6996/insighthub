global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/recording-rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]

scrape_configs:
  - job_name: insighthub-api
    metrics_path: /metrics
    static_configs:
      - targets: [api:8000]
        labels:
          component: api

  - job_name: insighthub-redis
    static_configs:
      - targets: [redis-exporter:9121]
        labels:
          component: redis
    metric_relabel_configs:
      # The exporter is configured with exactly one queue key, so every
      # redis_key_size sample in this scrape is the configured ARQ ZCARD.
      - source_labels: [__name__]
        regex: redis_key_size
        target_label: __name__
        replacement: insighthub_arq_queue_depth

  - job_name: insighthub-postgres
    static_configs:
      - targets: [postgres-exporter:9187]
        labels:
          component: postgres

  - job_name: insighthub-web-blackbox
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: [http://web:3000/api/health]
        labels:
          component: web
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

# The worker has no application metrics endpoint by design. Its Kubernetes
# pod/container state is supplied by kube-state-metrics and cAdvisor in EKS.
