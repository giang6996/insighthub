# Pinned from kubernetes-sigs/secrets-store-csi-driver v1.6.0:
# deploy/rbac-secretprovidersyncing.yaml
# Namespace adapted to the live EKS add-on installation: aws-secrets-manager.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: secretprovidersyncing-role
rules:
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: secretprovidersyncing-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: secretprovidersyncing-role
subjects:
  - kind: ServiceAccount
    name: secrets-store-csi-driver
    namespace: aws-secrets-manager
