name: Day 3 final official verifier

on:
  push:
    branches: [verify/day3-final]

permissions:
  contents: read
  actions: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout frozen Day 3 source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 120843f337943d6fd8f55a7c3115d76b1bb3d129
          persist-credentials: false

      - name: Assert frozen source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "120843f337943d6fd8f55a7c3115d76b1bb3d129"
          git rev-parse HEAD

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12'

      - name: Install pinned verification tools
        run: python -m pip install --disable-pip-version-check checkov==3.3.19 pytest==8.4.2 pyyaml==6.0.2

      - name: Print verification tool versions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python --version
          terraform version
          checkov --version
          gh --version
          gh auth status

      - name: Generate fresh Day 3 evidence
        run: |
          python scripts/build_day3_artifact.py \
            --output evidence/day3-deployment.zip \
            --manifest evidence/day3-ci-binding.json \
            --evidence-dir evidence

      - name: Record fingerprint and evidence metadata
        run: |
          python scripts/verify.py fingerprint
          python -c "import json; print(json.dumps(json.load(open('evidence/day3-ci-binding.json')), indent=2))"
          python -c "import json; d=json.load(open('evidence/day3.json')); print(json.dumps({k:d.get(k) for k in ('schema_version','day','mode','source_sha256','artifacts')}, indent=2))"

      - name: Run official Day 3 verifier
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/verify-day-3.sh \
            --ci-repo giang6996/insighthub \
            --ci-run-id 35949605102 \
            --evidence-dir evidence \
            --json \
            | tee evidence/day3-verifier-result.json

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: day3-final-verification
          path: |
            evidence/day3.json
            evidence/day3-ci-binding.json
            evidence/day3-deployment.zip
            evidence/day3-verifier-result.json
          if-no-files-found: error
          retention-days: 7
